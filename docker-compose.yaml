services:
  backend:
    build:
      context: .
      dockerfile: app/backend/dockerfile
    container_name: backend
    environment:
      - postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/students_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: students_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d students_db
      interval: 0.2s
      timeout: 10s
      retries: 10

volumes:
  postgres_data: